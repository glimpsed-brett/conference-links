<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conference Links</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #222;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 32px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 16px;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
    }
    a:hover {
      background: #1558b0;
    }
  </style>
</head>
<body>
  <h1>Conference Links</h1>
  <ul>
    <li><a href="https://main.arcsys.live">Main Session</a></li>
    <li><a href="https://alm.arcsys.live">ALM Session</a></li>
  </ul>
</body>
</html>
